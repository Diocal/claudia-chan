<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claudia-chan VR</title>
<style>
  html, body { margin: 0; height: 100%; background: #f6eef8; overflow: hidden; font: 15px system-ui, sans-serif; color: #33263a; }
  canvas { display: block; }
  #intro { position: fixed; left: 50%; top: 18px; transform: translateX(-50%); width: min(92vw, 460px); padding: 14px 18px; border-radius: 16px; background: #fffc; box-shadow: 0 6px 24px #0002; text-align: center; }
  #intro h1 { margin: 0 0 4px; font-size: 19px; }
  #intro p { margin: 4px 0; font-size: 13.5px; color: #6d5a74; }
  #state { font-weight: 600; color: #ff5fa2; }
  #talk { margin-top: 8px; padding: 10px 18px; border: 0; border-radius: 999px; background: #ff5fa2; color: #fff; font: 700 15px system-ui, sans-serif; }
  #talk.on { background: #fff; color: #ff5fa2; outline: 2px solid #ff5fa2; }
  /* The XR buttons from three.js sit at the bottom. */
</style>
<script type="importmap">
{ "imports": {
  "three": "/node_modules/three/build/three.module.js",
  "three/addons/": "/node_modules/three/examples/jsm/",
  "@pixiv/three-vrm": "/node_modules/@pixiv/three-vrm/lib/three-vrm.module.js"
} }
</script>
</head>
<body>
<div id="intro">
  <h1>Claudia-chan en tu espacio</h1>
  <p>Pulsa el botón de abajo para entrar. Dentro: <b>mantén el gatillo</b> para hablarle y suelta para enviar.</p>
  <p id="state">Conectando…</p>
  <button id="talk">🎤 Mantén para hablar</button>
</div>
<script type="module" src="/vr.js"></script>
</body>
</html>

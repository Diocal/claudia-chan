<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  /* She fades out at the waist instead of being sliced by the window edge. */
  canvas {
    position: fixed; inset: 0;
    -webkit-mask-image: linear-gradient(#000 80%, transparent 99%);
  }
  /* Whole body on screen: no fade, her feet are part of the picture. */
  body.full canvas { -webkit-mask-image: none; }
  #bubble {
    position: fixed; top: 10px; left: 20px; right: 20px; padding: 10px 14px;
    background: #fff; color: #2a2030; border-radius: 16px;
    font: 600 15px system-ui, sans-serif; text-align: center;
    opacity: 0; transition: opacity .25s;
  }
  #bubble.on { opacity: 1; }
  #hint {
    position: fixed; z-index: 2; bottom: 16px; left: 40px; right: 40px; padding: 6px 10px;
    background: #ff5fa2; color: #fff; border-radius: 12px; display: none;
    font: 700 13px system-ui, sans-serif; text-align: center;
    animation: rub 1s ease-in-out infinite alternate;
  }
  #hint.on { display: block; }
  /* The hover toolbar beside her: shown when the cursor comes near; the window only takes clicks over it. */
  #tools {
    position: fixed; z-index: 3; right: 8px; top: 112px; display: flex; flex-direction: column; gap: 8px;
    opacity: 0; transform: translateX(8px); transition: opacity .2s, transform .2s; pointer-events: none;
  }
  #tools.on { opacity: 1; transform: none; pointer-events: auto; }
  #tools button {
    width: 38px; height: 38px; border: 0; border-radius: 50%; background: #fff; color: #33263a; cursor: pointer;
    font-size: 18px; line-height: 38px; padding: 0; box-shadow: 0 2px 8px #0003; position: relative;
  }
  #tools button:hover { background: #ffe3ef; }
  #tools button.on { background: #ff5fa2; color: #fff; }
  #tools #drag { cursor: grab; }
  #tools #drag:active { cursor: grabbing; }
  /* Listening: the microphone pulses red until you press it again. */
  #tools #talk.on { background: #e0406a; color: #fff; animation: pulse .9s ease-in-out infinite alternate; }
  @keyframes pulse { to { box-shadow: 0 0 0 6px #e0406a55; } }
  /* First run: every button wears its name until one of the newer ones is used. */
  #tools.tour button::before {
    content: attr(data-label); position: absolute; right: 46px; top: 7px; white-space: nowrap;
    background: #33263a; color: #fff; font: 600 12px system-ui, sans-serif; line-height: 1.3;
    padding: 4px 8px; border-radius: 10px;
  }
  /* Stays beside her while she is muted, so a silent Claudia is never a mystery. */
  #badge { position: fixed; z-index: 2; right: 18px; top: 86px; font-size: 14px; opacity: .8; pointer-events: none; }
  #move {
    position: fixed; bottom: 16px; left: 30px; right: 30px; padding: 8px 10px; display: none;
    background: #4f8ff0; color: #fff; border-radius: 12px;
    font: 700 13px system-ui, sans-serif; text-align: center;
  }
  #move.on { display: block; }
  #mic {
    position: fixed; z-index: 2; bottom: 16px; left: 30px; right: 30px; padding: 8px 10px; display: none;
    background: #e0406a; color: #fff; border-radius: 12px;
    font: 700 13px system-ui, sans-serif; text-align: center;
  }
  #mic.on { display: block; }
  @keyframes rub { from { transform: translateX(-14px); } to { transform: translateX(14px); } }
  .heart {
    position: fixed; top: 150px; color: #ff4d94; font-size: 28px;
    animation: rise 1.4s ease-out forwards;
  }
  @keyframes rise { to { transform: translateY(-110px) scale(1.5); opacity: 0; } }
  /* Her games: a small card at her feet, clear of her face and of the buttons at her right. While it
     is open the app lets this part of the window take clicks (main.js gameArea). */
  #gamecard {
    position: fixed; z-index: 4; left: 14px; right: 62px; bottom: 14px; padding: 8px 12px 12px; display: none;
    background: #fffafc; color: #33263a; border-radius: 16px; box-shadow: 0 4px 16px #0004;
    font: 600 13px system-ui, sans-serif; user-select: none;
  }
  #gamecard.on { display: block; }
  #gamecard button { font: inherit; color: inherit; border: 0; cursor: pointer; }
  #gamehead { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  #gametitle { flex: 1; font-weight: 800; font-size: 14px; }
  #gamehead button { width: 26px; height: 26px; border-radius: 50%; background: #f3e6ee; line-height: 26px; padding: 0; }
  #gamehead button:hover, #gamebody button:hover:not(:disabled) { background: #ffd3e6; }
  #gamemenu[hidden], #gamehow[hidden], #gamechip[hidden] { display: none; }
  /* First time only: one line on how to play. */
  #gamehow { margin: 0 0 8px; padding: 6px 8px; background: #fff0c9; border-radius: 10px; font-weight: 600; line-height: 1.3; }
  #gamebody button { background: #f3e6ee; border-radius: 12px; padding: 8px 10px; }
  #gamebody button:disabled { opacity: .35; cursor: default; }
  #gamebody .list { display: grid; gap: 6px; }
  #gamebody .list button { text-align: left; }
  #gamebody .row { display: flex; gap: 8px; justify-content: center; }
  #gamebody .hands button { font-size: 26px; flex: 1; padding: 6px 0; }
  #gamebody .stage { min-height: 44px; margin-bottom: 6px; text-align: center; font-size: 30px; line-height: 44px; }
  #gamebody .stage.small { font-size: 16px; }
  #gamebody .stats { display: flex; justify-content: space-between; gap: 8px; margin: 6px 2px 0; color: #6d5a75; }
  #gamebody .stats b { color: #33263a; }
  #gamebody .pad { display: block; width: 100%; height: 84px; font-size: 22px; font-weight: 800; }
  #gamebody .pad.wait { background: #e9dfe6; color: #8a7a90; }
  #gamebody .pad.go { background: #ff5fa2; color: #fff; }
  #gamebody .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
  #gamebody .grid button { padding: 6px 0; }
  #gamebody .grid button.hit { background: #ff5fa2; color: #fff; opacity: 1; }
  #gamebody .main { display: block; margin: 8px auto 0; background: #ff5fa2; color: #fff; padding: 8px 18px; }
  #gamebody .main:hover:not(:disabled) { background: #ff7fb5; }
  /* Claude finished while you play: said here, without interrupting the game. */
  #gamechip { margin-top: 8px; padding: 4px 8px; background: #d9f5e3; color: #1f6b3f; border-radius: 10px; text-align: center; }
  /* Where the hearts and stars drift while she tosses them. */
  #field { position: fixed; z-index: 3; left: 14px; right: 62px; top: 64px; bottom: 150px; display: none; }
  #field.on { display: block; }
  .toss {
    position: absolute; width: 40px; height: 40px; border: 0; padding: 0; background: none; cursor: pointer;
    font-size: 28px; line-height: 40px; filter: drop-shadow(0 1px 3px #0005);
    animation: drift linear forwards;
  }
  @keyframes drift {
    0% { transform: scale(.4); opacity: 0; }
    12% { transform: translate(calc(var(--dx) * .12), calc(var(--dy) * .12)) scale(1); opacity: 1; }
    70% { opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(.8); opacity: 0; }
  }
  .plus { position: absolute; color: #ff4d94; font: 800 16px system-ui, sans-serif; pointer-events: none; animation: plus .6s ease-out forwards; }
  @keyframes plus { to { transform: translateY(-30px); opacity: 0; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "/node_modules/three/build/three.module.js",
  "three/addons/": "/node_modules/three/examples/jsm/",
  "@pixiv/three-vrm": "/node_modules/@pixiv/three-vrm/lib/three-vrm.module.js"
} }
</script>
</head>
<body>
<div id="bubble"></div>
<div id="hint">↔ Pasa el cursor de lado a lado sobre mi cabeza</div>
<div id="mic">🎤 Te escucho… Ctrl+Alt+V para terminar</div>
<div id="tools">
  <button id="stay" title="Quieta / pasear">📌</button>
  <button id="menu" title="Menú">☰</button>
  <button id="drag" title="Arrastrar">✋</button>
  <button id="mute" title="Silenciar">🔊</button>
  <button id="talk" title="Hablarle">🎤</button>
  <button id="quiet" title="No molestar">🌙</button>
  <button id="hide" title="Ocultarme">👁</button>
  <button id="games" title="Jugar">🎮</button>
</div>
<div id="badge"></div>
<div id="field"></div>
<div id="gamecard">
  <div id="gamehead"><span id="gametitle"></span><button id="gamemenu" hidden>☰</button><button id="gameclose">✕</button></div>
  <p id="gamehow" hidden></p>
  <div id="gamebody"></div>
  <div id="gamechip" hidden></div>
</div>
<div id="move">Te sigo con el cursor. Ctrl+Alt+C para soltarme aquí</div>
<script type="module" src="/avatar.js"></script>
</body>
</html>
